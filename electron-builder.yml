appId: com.customermoneymanager.desktop
productName: Customer Money Manager
copyright: Copyright © 2026 Customer Money Manager
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/better-sqlite3/{src,deps,binding.gyp,README.md}'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**'
# better-sqlite3 13 ships N-API prebuilt binaries; they run on Electron without a rebuild.
npmRebuild: false
asar: true
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Customer-Money-Manager-Setup-${version}-${arch}.${ext}
  files:
    - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
    - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Customer Money Manager
  # Customer data lives in %APPDATA%\Customer Money Manager and is kept on uninstall.
  deleteAppDataOnUninstall: false
mac:
  target: [dmg]
  category: public.app-category.finance
  icon: build/icon.png
linux:
  target: [AppImage]
  category: Office
  icon: build/icon.png
